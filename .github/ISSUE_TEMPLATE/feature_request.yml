name: Feature request
description: Suggest a check, an input type, or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you're trying to do with DubEval, and what's missing.
      placeholder: I want to evaluate a dub that only exists as a second audio track in an MKV file.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Optional.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Length and timing
        - Translation meaning
        - Voice, speakers, pronunciation, fluency
        - Lip sync
        - Inputs (files, links, subtitles)
        - Interface or desktop app
        - Something else
