<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>DubEval</title>
<style>
/* PersoDub's palette, like the web interface (see NOTICE). */
:root { --bg: #0e131b; --card: #1c2129; --text: #eaf0fd; --muted: #9ea5b0; --line: #30363f; --accent: #166CFB; --poor: #f47b74;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 13px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
html:lang(ko) body { word-break: keep-all; overflow-wrap: break-word; }
main { width: min(560px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 28px; }
h1 { font-size: 20px; margin: 0 0 6px; }
p { margin: 6px 0; color: var(--muted); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
  animation: spin 1s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.error h1 { color: var(--poor); }
/* Starting: as PersoDub's start, and the same as the web page's own boot screen (style.css .boot). */
.starting main { background: none; border: none; width: min(700px, calc(100vw - 64px)); padding: 0; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; font-weight: 700; font-size: 16px; }
.brand img { width: 34px; height: 34px; border-radius: 8px; }
.starting h1 { font-size: 28px; margin-bottom: 18px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
.bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 32%; border-radius: 4px; background: var(--accent);
  animation: slide 1.6s ease-in-out infinite; animation-delay: var(--sweep, 0s); }
@keyframes slide { from { left: -32%; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .bar::after { animation: none; left: 0; width: 100%; opacity: .5; } }
.starting .spinner { display: none; }
/* The window has no Windows title bar: this strip is where it is dragged (the page's own top bar does it later). */
.drag { position: fixed; top: 0; left: 0; right: 0; height: 36px; -webkit-app-region: drag; }
pre { background: #232831; border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 220px;
  overflow: auto; font-size: 12px; white-space: pre-wrap; color: var(--muted); }
</style>
</head>

const state = TEXT[q.get("state")] ? q.get("state") : "starting";
const lang = ["en", "ko", "pt", "es"].includes(q.get("lang")) ? q.get("lang") : "en";
const [title, text] = TEXT[state][lang];
document.documentElement.lang = lang;
document.documentElement.style.setProperty("--sweep", `-${Date.now() % 1600}ms`);   // the web page's bar goes on from here
document.getElementById("title").textContent = title;
document.getElementById("text").textContent = text;
if (state === "starting") document.body.classList.add("starting");
if (state !== "starting") {
  const box = document.getElementById("box");
  box.classList.add("error");
  box.querySelector(".spinner").remove();
  document.getElementById("bar").remove();
  if (q.get("detail")) {
    const pre = document.createElement("pre");
    pre.textContent = q.get("detail");
    box.append(pre);
  }
}
</script>
</body>
</html>
